<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="wizard.title">Karien — Kurulum</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/wizard.css">
</head>
<body class="app-page">
  <div class="wizard-overlay">
    <div class="wizard-container">

      <!-- Branding -->
      <div class="wizard-branding">
        <div class="brand-name">Karien</div>
        <div class="brand-tagline" data-i18n="wizard.tagline">Hadi seni hazırlayalım ✨</div>
      </div>

      <!-- Progress -->
      <div class="wizard-progress">
        <div class="progress-dot active" id="progress-dot-0"></div>
        <div class="progress-connector" id="progress-conn-0"></div>
        <div class="progress-dot" id="progress-dot-1"></div>
        <div class="progress-connector" id="progress-conn-1"></div>
        <div class="progress-dot" id="progress-dot-2"></div>
      </div>

      <!-- Steps -->
      <div class="wizard-steps">

        <!-- STEP 0: STT -->
        <div class="wizard-step active" id="wizard-step-0">
          <div class="step-header">
            <span class="step-emoji">🎙️</span>
            <h2 class="step-title" data-i18n="wizard.step0.title">Kulaklarını seç</h2>
            <p class="step-subtitle" data-i18n="wizard.step0.subtitle">Karien seni nasıl dinlesin?</p>
          </div>
          <div class="provider-cards" id="step-0-cards"></div>
        </div>

        <!-- STEP 1: LLM -->
        <div class="wizard-step" id="wizard-step-1">
          <div class="step-header">
            <span class="step-emoji">🧠</span>
            <h2 class="step-title" data-i18n="wizard.step1.title">Beynini seç</h2>
            <p class="step-subtitle" data-i18n="wizard.step1.subtitle">Karien'in düşünme gücünü hangi model versin?</p>
          </div>
          <div class="provider-cards" id="step-1-cards"></div>
        </div>

        <!-- STEP 2: TTS -->
        <div class="wizard-step" id="wizard-step-2">
          <div class="step-header">
            <span class="step-emoji">🗣️</span>
            <h2 class="step-title" data-i18n="wizard.step2.title">Sesini seç</h2>
            <p class="step-subtitle" data-i18n="wizard.step2.subtitle">Karien sana nasıl seslensin?</p>
          </div>
          <div class="provider-cards" id="step-2-cards"></div>
        </div>

      </div>

      <!-- Navigation -->
      <div class="wizard-nav">
        <button class="wizard-btn secondary" id="wizard-prev" onclick="prevStep()" style="display:none;" data-i18n="wizard.back">
          ← Geri
        </button>
        <span class="step-counter" id="step-counter">Adım 1 / 3</span>
        <button class="wizard-btn primary" id="wizard-next" onclick="nextStep()" data-i18n="wizard.next">
          İleri →
        </button>
        <button class="wizard-btn finish" id="wizard-finish" onclick="finishWizard()" style="display:none;" data-i18n="wizard.finish">
          Başlayalım! 🚀
        </button>
      </div>

    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/util.js"></script>
  <script src="js/wizard.js"></script>
</body>
</html>
