<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Karien Overlay</title>

    <!--
      Overlay avatar window (frameless / transparent / always-on-top).
      Contract with assistant/ui/api.py (do not rename these globals):
        overlaySlideIn()      → slide the avatar in from the right
        overlaySlideOut()     → slide the avatar out to the right
        overlaySetState(s)    → s ∈ hidden | listen | think | speak (data-state)
        overlaySetMood(m)     → one of the 9 mood tags (data-mood)
        overlaySetSkin(id)    → swap the skin stylesheet (ui/avatars/<id>/skin.css)

      All visuals are driven by the data-state / data-mood attributes on
      #avatar-root; each skin is a self-contained stylesheet reacting to
      them. The #avatar-root markup is mounted from the single canonical
      template in js/avatar-dom.js (shared with the main-window preview
      stage); structural rules live in css/avatar-base.css.
    -->
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/avatar-base.css">
    <link rel="stylesheet" href="css/overlay.css">
    <link rel="stylesheet" href="avatars/orb/skin.css" id="skin-link">
</head>

<body>
    <!-- #avatar-root is mounted here by js/overlay.js via AvatarDom.mount -->

    <script src="js/i18n.js"></script>
    <script src="js/util.js"></script>
    <script src="js/avatar-dom.js"></script>
    <script src="js/overlay.js"></script>
</body>

</html>
