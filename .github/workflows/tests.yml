name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Slim install: only what the brain/MCP layers import.
      # Audio/GUI deps (pyaudio, pywebview, torch) are not needed by the tests
      # and would require system packages on the runner.
      - name: Install test dependencies
        run: pip install pytest openai python-dotenv colorlog mcp keyring httpx
      - name: Run regression tests
        run: pytest tests/ -v
